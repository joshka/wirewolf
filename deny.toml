# cargo deny check: advisories, licenses, bans, and sources.

[graph]
all-features = true

[advisories]
ignore = [
    # rsa (via openidconnect): the Marvin timing attack needs private-key operations. wirewolf
    # only verifies ID token signatures with the issuer's public key.
    { id = "RUSTSEC-2023-0071", reason = "only public-key verification; no private RSA keys" },
    # crypto-bigint 0.5 (via rsa and the p256/p384 curves): timing variability in constant-time
    # operations. Same exposure as above: signature verification of public data only.
    { id = "RUSTSEC-2026-0387", reason = "only public-key verification of ID tokens" },
    # The desktop app (wirewolf-app) builds for macOS. These are in Tauri's Linux-only tree
    # (GTK bindings and the D-Bus tray), which never compiles into the app.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros: Linux-only GTK bindings" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus and ksni: Linux-only tray icon" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus and ksni: Linux-only tray icon" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus and ksni: Linux-only tray icon" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # The desktop app's dependencies: Tauri's config tooling (cssparser, selectors, dtoa-short,
    # at build time) and dirs (option-ext). File-level copyleft; none of their files are changed.
    "MPL-2.0",
    # ksni, the Linux tray icon in Tauri's tree.
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
