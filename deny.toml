# cargo deny check: advisories, licenses, bans, and sources.

[graph]
all-features = true

[advisories]
ignore = [
    # rsa (via openidconnect): the Marvin timing attack needs private-key operations. wirewolf
    # only verifies ID token signatures with the issuer's public key.
    { id = "RUSTSEC-2023-0071", reason = "only public-key verification; no private RSA keys" },
    # crypto-bigint 0.5 (via rsa and the p256/p384 curves): timing variability in constant-time
    # operations. Same exposure as above: signature verification of public data only.
    { id = "RUSTSEC-2026-0387", reason = "only public-key verification of ID tokens" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
