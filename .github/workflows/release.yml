# Releases wirewolf.
#
# - Version tags (v*) publish the crates to crates.io through trusted publishing (no token
#   stored here) and the image ghcr.io/<owner>/wirewolf:<version>, :<major.minor>, and :latest.
# - Pushes to main publish ghcr.io/<owner>/wirewolf:main, for hosts that track main.
# - Version tags also attach prebuilt binaries (Linux x86_64 and aarch64, macOS arm64 and
#   x86_64) to the GitHub release, creating it as a draft if it doesn't exist yet, with SLSA
#   provenance for each archive. `cargo binstall wirewolf` downloads them.
#
# Images get an SBOM, SLSA build provenance, and a keyless cosign signature tied to this workflow.
#
# Verify a published image:
#   cosign verify ghcr.io/joshka/wirewolf:<tag> \
#     --certificate-identity-regexp 'https://github.com/joshka/wirewolf/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wirewolf
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/wirewolf
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/wirewolf
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # wirewolf-web ships the built dashboard rather than its Node sources.
      - name: Build the dashboard
        working-directory: crates/wirewolf-web/ui-shadcn
        run: pnpm install --frozen-lockfile && pnpm build
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ github.ref_name }}
        # Dependency order. Skip versions already on crates.io, e.g. a release published by hand.
        run: |
          version="${VERSION#v}"
          for crate in wirewolf-core wirewolf-probe wirewolf-tui wirewolf-web wirewolf-cli wirewolf; do
            if curl -fsS -A "wirewolf-release (github.com/${{ github.repository }})" \
                "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate $version is already published"
            else
              # wirewolf-web includes the dashboard build, which git ignores, so it reads as dirty.
              cargo publish --locked --allow-dirty -p "$crate"
            fi
          done

  # The dashboard is built once here and embedded by every binary build below, so those jobs
  # need no Node and all ship the same assets.
  dashboard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build the dashboard
        working-directory: crates/wirewolf-web/ui-shadcn
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: crates/wirewolf-web/ui-shadcn/dist
          if-no-files-found: error

  binaries:
    needs: dashboard
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04's glibc 2.35 is the floor, so the Linux binaries run on Debian 12 and
          # Ubuntu 22.04 or newer, including Raspberry Pi OS bookworm.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            # Cross-compiled the way the Dockerfile does it.
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # upload release assets
      id-token: write # provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard
          path: crates/wirewolf-web/ui-shadcn/dist
      - name: Install the cross toolchain
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Build
        env:
          WIREWOLF_UI_SHADCN_PREBUILT: "1"
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
        run: |
          if [ -n "$LINKER" ]; then
            upper="$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
            export "CARGO_TARGET_${upper}_LINKER=$LINKER" "CC_${TARGET//-/_}=$LINKER"
          fi
          cargo build --release --locked --bin wirewolf --target "$TARGET"
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="wirewolf-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/wirewolf" README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        # The release is usually created by hand from the changelog; if the tag got here first,
        # start a draft so the assets have somewhere to go.
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "wirewolf ${TAG#v}" --notes "See CHANGELOG.md."
          gh release upload "$TAG" "$ARCHIVE" --clobber

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --pattern 'wirewolf-*.tar.gz'
          sha256sum wirewolf-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber
