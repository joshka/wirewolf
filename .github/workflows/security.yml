# Dependency and supply-chain checks. Runs on every push and PR, and daily so new advisories
# against unchanged dependencies show up.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Advisories, licenses, banned crates, and crate sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Fails if Cargo.lock is out of date with the manifests.
      - run: cargo metadata --locked --format-version 1 > /dev/null

  pnpm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/wirewolf-web/ui-shadcn
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      # --frozen-lockfile fails if pnpm-lock.yaml doesn't match package.json.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level moderate
