# Dependency and supply-chain checks. Runs on every push and PR, and daily so new advisories
# against unchanged dependencies show up.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Advisories, licenses, banned crates, and crate sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Fails if Cargo.lock is out of date with the manifests.
      - run: cargo metadata --locked --format-version 1 > /dev/null

  pnpm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/wirewolf-web/ui-shadcn
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: corepack enable
      # --frozen-lockfile fails if pnpm-lock.yaml doesn't match package.json.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level moderate
