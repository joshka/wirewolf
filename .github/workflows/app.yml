# Builds the Mac app (crates/wirewolf-app, docs/app.md) and keeps the bundle as a workflow
# artifact. The bundle is unsigned: signing and notarizing need an Apple Developer account, and
# the workflow has no certificate.
name: app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true # the app icons
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: cargo install tauri-cli --version 3.0.0-alpha.5 --locked
      - run: cargo test -p wirewolf-app --locked
      - name: Build the bundle
        working-directory: crates/wirewolf-app
        run: cargo tauri build --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Wirewolf-macOS
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
