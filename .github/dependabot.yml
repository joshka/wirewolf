# Keeps the pinned Docker base images, GitHub Actions, and dependencies current.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /crates/wirewolf-web/ui-shadcn
    schedule:
      interval: weekly
