# docker compose up -d, then open http://<host>:7465
services:
  wirewolf:
    image: ghcr.io/joshka/wirewolf:latest
    build: .
    restart: unless-stopped
    # Host networking so the probes see the real LAN, router, and ISP path.
    network_mode: host
    # Root in the container only for raw ICMP (the ISP TTL probes). Drop every other capability
    # and keep the filesystem read-only except the /data volume.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    security_opt: [no-new-privileges:true]
    volumes:
      - wirewolf:/data
    # Settings live in /data/wirewolf.toml (in the volume). Start one with:
    #   docker compose run --rm wirewolf config default > wirewolf.toml
    # Or set any key as WIREWOLF_<SECTION>_<KEY>, which overrides the file, e.g.
    # WIREWOLF_PROBE_INTERVAL: 30s or WIREWOLF_SPEED_INTERVAL: "0" to turn off scheduled speed
    # tests. docs/deploy.md has an OIDC example configured entirely here.
    environment:
      # Shown in the UI; the container hostname is otherwise random.
      WIREWOLF_HOSTNAME: wirewolf
volumes:
  wirewolf:
