# docker compose up -d, then open http://<host>:7465
services:
  wirewolf:
    image: ghcr.io/joshka/wirewolf:latest
    build: .
    restart: unless-stopped
    # Host networking so the probes see the real LAN, router, and ISP path.
    network_mode: host
    volumes:
      - wirewolf:/data
    # Settings live in /data/wirewolf.toml (in the volume). Start one with:
    #   docker compose run --rm wirewolf config default > wirewolf.toml
    # Environment variables override the file, e.g. WIREWOLF_INTERVAL: 30s or
    # WIREWOLF_SPEED_INTERVAL: "0" to turn off scheduled speed tests.
    environment:
      # Shown in the UI; the container hostname is otherwise random.
      WIREWOLF_HOSTNAME: wirewolf
volumes:
  wirewolf:
