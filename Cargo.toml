[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app (crates/wirewolf-app) builds with `cargo tauri` and needs a webview toolkit, so
# plain `cargo build`, `cargo test`, and `cargo clippy` leave it out. Build it with `-p wirewolf-app`.
default-members = ["crates/wirewolf", "crates/wirewolf-cli", "crates/wirewolf-core", "crates/wirewolf-probe", "crates/wirewolf-tui", "crates/wirewolf-web"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshka/wirewolf"
rust-version = "1.88"

[workspace.dependencies]
wirewolf-core = { path = "crates/wirewolf-core", version = "0.2.0" }
wirewolf-probe = { path = "crates/wirewolf-probe", version = "0.2.0" }
wirewolf-web = { path = "crates/wirewolf-web", version = "0.2.0" }
wirewolf-tui = { path = "crates/wirewolf-tui", version = "0.2.0" }
wirewolf-cli = { path = "crates/wirewolf-cli", version = "0.2.0" }
