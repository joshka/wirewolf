[package]
name = "wirewolf-tui"
description = "Terminal UI client for wirewolf."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.38"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tui-big-text = "0.8.10"
wirewolf-core = { version = "0.0.0", path = "../wirewolf-core" }
