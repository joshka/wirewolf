[package]
name = "wirewolf-cli"
description = "Command line interface for wirewolf."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wirewolf-core = { version = "0.0.0", path = "../wirewolf-core", features = ["demo"] }
wirewolf-probe = { version = "0.0.0", path = "../wirewolf-probe" }
wirewolf-web = { version = "0.0.0", path = "../wirewolf-web" }

[features]
ui-shadcn = ["wirewolf-web/ui-shadcn"]
