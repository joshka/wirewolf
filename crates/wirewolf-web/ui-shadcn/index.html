<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>wirewolf</title>
    <style>
      /* Paint the theme background before the stylesheet and app load. */
      html { background: #fff; }
      html.dark { background: oklch(0.145 0 0); }
    </style>
    <script>
      // Apply the stored or system theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme") || "system"
        const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Firefox paints the empty page while the bundle loads, which flashes on reload. Put back the
      // markup saved on the way out (see main.tsx) so the first paint already shows the dashboard;
      // React replaces it on its first render.
      try {
        const s = JSON.parse(sessionStorage.getItem("wirewolf.shell") || "null")
        if (s && s.url === location.href && Date.now() - s.savedAt < 5 * 60 * 1000) {
          document.getElementById("root").innerHTML = s.html
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
