[package]
name = "wirewolf-web"
description = "Web API and dashboard for wirewolf."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
maud = { version = "0.27.0", optional = true }
axum = "0.8.9"
futures-util = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
wirewolf-core = { version = "0.0.0", path = "../wirewolf-core" }
rust-embed = { version = "8.13.0", optional = true, features = ["mime-guess"] }

[features]
default = ["ui-htmx"]
# The React + Vite + shadcn/ui variant at /ui/shadcn/. Needs Node + pnpm at build time (see build.rs).
ui-shadcn = ["dep:rust-embed"]
# Server-rendered HTMX + Basecoat dashboard at /ui/htmx. No build step.
ui-htmx = ["dep:maud"]
