[package]
name = "wirewolf-web"
description = "Web API and dashboard for wirewolf."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
# Ship the built dashboard, not its Node sources, so installing from crates.io needs no Node.
# Release builds run `pnpm build` first (see .github/workflows); `cargo package` checks it's there.
include = ["/src/**", "/build.rs", "/README.md", "/LICENSE-*", "/ui-shadcn/dist/**"]

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
wirewolf-core = { version = "0.1.1", path = "../wirewolf-core" }
rust-embed = { version = "8.13.0", optional = true, features = ["mime-guess", "debug-embed"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
ipnet = { version = "2.12.2", default-features = false }
base64 = "0.23.1"
rand = "0.10"
time = "0.3.55"
sha2 = "0.10"

[features]
default = ["ui-shadcn"]
# The React + Vite + shadcn/ui dashboard. Needs Node + pnpm at build time (see build.rs), or
# WIREWOLF_UI_SHADCN_PREBUILT=1 with a prebuilt dist/.
ui-shadcn = ["dep:rust-embed"]

[dev-dependencies]
chrono = "0.4.45"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
wirewolf-core = { path = "../wirewolf-core", features = ["demo"] }
