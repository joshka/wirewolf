[package]
name = "wirewolf"
description = "Network diagnostics you can point a browser at: where the path breaks, how bad, since when."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"

# `cargo binstall wirewolf` downloads the archive the release workflow attaches to each tag.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[dependencies]
anyhow = "1.0.104"
wirewolf-cli = { version = "0.2.0", path = "../wirewolf-cli" }

[features]
ui-shadcn = ["wirewolf-cli/ui-shadcn"]
