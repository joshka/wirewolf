[package]
name = "wirewolf-probe"
description = "Network probes, speed tests, and history storage for wirewolf."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bytes = "1"
fastrand = "2.5.0"
futures-util = "0.3.34"
hickory-resolver = "0.26.3"
libc = "0.2"
jiff = { version = "0.2.38", features = ["serde"] }
netdev = "0.47.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = "0.26"
tracing = "0.1.44"
webpki-roots = "1"
wirewolf-core = { version = "0.2.0", path = "../wirewolf-core" }
